name: GitHub Sync to Linear
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::CF_ACCOUNT_ID secret is not set. Please configure it in repository Settings > Secrets."
            exit 1
          fi
          if [ -z "$LINEAR_API_KEY" ]; then
            echo "::error::LINEAR_API_KEY secret is not set. Please configure it in repository Settings > Secrets."
            exit 1
          fi

      - name: Sync GitHub to Linear
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          curl -X POST https://linear-sync.$CF_ACCOUNT_ID.workers.dev/sync/github \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINEAR_API_KEY"

      - name: Notify Slack on success
        if: success()
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -X POST https://slack-notifications.$CF_ACCOUNT_ID.workers.dev/api/notify \
            -H "Content-Type: application/json" \
            -d '{"message": "✅ GitHub to Linear sync completed successfully"}'

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          curl -X POST https://slack-notifications.$CF_ACCOUNT_ID.workers.dev/api/notify \
            -H "Content-Type: application/json" \
            -d '{"message": "❌ GitHub to Linear sync failed"}'
